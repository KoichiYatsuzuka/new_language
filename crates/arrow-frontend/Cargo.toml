[package]
name = "arrow-frontend"
version = "0.1.0"
edition = "2021"
description = "Arrow language frontend (lexer + parser + type checker) built for editors, including wasm32."

[lib]
crate-type = ["cdylib", "rlib"]

# ⚠ ここには **ネイティブ依存を足さないこと**。pyo3 / libloading を入れた瞬間に
#    wasm32 ビルドが壊れ、この crate の存在意義（VS Code 拡張への同梱）が無くなる。
[dependencies]
indexmap = "2"
serde_json = "1"
# ⚠ 評価コア（`src/interpreter` の取り込み）が使う。**純 Rust なので wasm32 に載る**
#   （評価コア切り出し #6）。ネイティブ依存ではないので上の禁止事項には当たらない。
regex = "1"
# ⚠ `import[py]` / `import[py-int]` の型の出所（`.py` / `.pyi` を Arrow へ写す `python_converter`）。
#   **純 Rust のパーサなので wasm32 に載る**（editor_import_resolution_plan.md 2-2 で確かめた）。
#   ルート crate では `native` に入っているが、それは Python 相互運用（pyo3）と一緒に外すため。
rustpython-parser = "0.4"

[features]
default = ["editor"]
# ルート crate の `editor` feature と同名。`src/parser/mod.rs` の #[cfg] がこれを見て
# import 解析を fs 非依存版へ差し替える。
editor = []
# ⚠ **有効にはしない。** 取り込んだ共有ソース（`src/interpreter` / `src/vm`）が持つ
#   `#[cfg(feature = "...")]` に対する `unexpected_cfgs` 警告を防ぐための宣言
#   （ルート crate が `editor` を宣言しているのと同じ理由）。
#   `native` を有効にすると pyo3 / libloading が要るので wasm32 ビルドが壊れる。
native = []
prof = []
tw_stats = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
