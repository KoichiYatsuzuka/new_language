[package]
name = "arrow"
version = "0.1.0"
edition = "2021"

[dependencies]
terminal_size = "0.4"
rustpython-parser = "0.4"
pyo3 = { version = "0.22", features = ["auto-initialize"] }
libloading = "0.8"
regex = "1"
indexmap = "2"
serde_json = "1"

[[bench]]
name = "field_access"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
