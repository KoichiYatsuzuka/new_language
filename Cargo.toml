[workspace]
# `crates/arrow-frontend` は wasm 用にフロントエンドを切り出した別クレート
# （ルートは pyo3 / libloading に依存していて wasm32 に載らないため）。
#
# ⚠ **メンバーではなく exclude にすること。** メンバーにするとルートの
#    `[profile.release]` が全体に適用され、`arrow.exe` が `opt-level="z"` /
#    `panic="abort"` でビルドされてしまう（＝速度ベンチの基準が静かに変わる）。
#    除外しておけば arrow-frontend は自分の profile と target ディレクトリを持ち、
#    ルート側のビルドは**一切影響を受けない**。
exclude = ["crates/arrow-frontend"]

[package]
name = "arrow"
version = "0.10.0"
edition = "2021"

[dependencies]
terminal_size = "0.4"
regex = "1"
indexmap = "2"
serde_json = "1"
# `bytes.decode` / `str.encode` の Shift_JIS などの文字コード（ffi_value_exchange_plan.md 3-1・D-13）。
# UTF-8 / UTF-16 / ASCII / Latin-1 は自前（Python と同じ意味）。wasm にも載る。
encoding_rs = "0.8"
# ⚠ **ネイティブ専用の依存**（wasm32 に載らない）。`native` feature で有効化する。
# これらを無効にしたビルドが「評価コア」で、VS Code 拡張（wasm）へ持ち込める範囲になる。
# 詳細と作業分割は implementation_logs/eval_core_extraction_plan.md を参照。
pyo3 = { version = "0.22", features = ["auto-initialize"], optional = true }
libloading = { version = "0.8", optional = true }
# アロケータ（copy_alloc_speed_plan.md 5-1・D-12）。Windows の標準のヒープは小さい確保と解放の繰り返しが遅く、
# 実行時間の 25〜48% を占めていた（インスタンス 1 個が 2〜3 回の確保）。`fast_alloc` feature で有効（既定で有効）。
# ⚠ C のソースをビルドする（`cc`・MSVC が要る）。exe に静的に入るので、配る DLL は増えない。
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
# ⚠ 既定で有効。`cargo build` の挙動は従来どおり。
# 外すと FFI（C/C++ DLL・.NET・Node）と Python 相互運用が落ち、
# 「評価コアだけ」のビルドになる（`cargo build --no-default-features`）。
default = ["native", "fast_alloc"]
native = ["dep:pyo3", "dep:libloading"]
# exe のアロケータを mimalloc にする（src/main.rs の `#[global_allocator]`・copy_alloc_speed_plan.md 5-1）。
# 外すと Rust の既定（Windows のプロセスのヒープ）に戻る: `cargo build --release --no-default-features --features native`
# （アロケータを疑うとき・メモリの使い方を比べるときに使う）。評価コア（`--no-default-features`）には入らない。
fast_alloc = ["dep:mimalloc"]
# 診断フック `AR_TW_STATS=1`（#10）。**既定では無効＝コード自体が消える。**
# 環境変数だけの分岐にすると `exec()` の 1 文ごとに OnceLock の atomic 読みが入り、
# 文ディスパッチ支配のワークロードで **11% 退行した**（partial_call_overhead.ar で実測）。
# 計測時は `cargo build --features tw_stats`（tw_stats.ps1 が自動で行う）。
tw_stats = []

# 診断フック `AR_COPY_STATS=1`（src/interpreter/copy_stats.rs・copy_alloc_speed_plan.md 1-2）: 値の複製の入口ごとの
# 回数と大きさを数える。**既定では無効＝コード自体が消える**（`tw_stats` と同じ理由）。
# 計測時は `cargo build --release --features copy_stats`（scripts/copy_stats.ps1 が専用の target に作る）。
copy_stats = []

# 実行時間分布の計測フック（src/prof.rs）。**既定では無効＝コード自体が消える。**
# `cargo build --release --features prof` でビルドし、`AR_PROF=1`（段のみ）/
# `AR_PROF=ops`（段 + op 別サンプリング）で有効化する。
prof = []

# エディタ解析ビルド（`crates/arrow-frontend` 専用）。
# import 解析をファイルシステムに触れない `parser/imports_editor.rs` に差し替え、
# `parser/cs_assembly` を外す。**bin では決して有効にしない**（ここで宣言しているのは
# 共有ソースの `#[cfg(feature = "editor")]` に対する unexpected_cfgs 警告を防ぐため）。
editor = []

[[bench]]
name = "field_access"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
