[workspace]
# `crates/arrow-frontend` は wasm 用にフロントエンドを切り出した別クレート
# （ルートは pyo3 / libloading に依存していて wasm32 に載らないため）。
#
# ⚠ **メンバーではなく exclude にすること。** メンバーにするとルートの
#    `[profile.release]` が全体に適用され、`arrow.exe` が `opt-level="z"` /
#    `panic="abort"` でビルドされてしまう（＝速度ベンチの基準が静かに変わる）。
#    除外しておけば arrow-frontend は自分の profile と target ディレクトリを持ち、
#    ルート側のビルドは**一切影響を受けない**。
exclude = ["crates/arrow-frontend"]

[package]
name = "arrow"
version = "0.1.0"
edition = "2021"

[dependencies]
terminal_size = "0.4"
rustpython-parser = "0.4"
pyo3 = { version = "0.22", features = ["auto-initialize"] }
libloading = "0.8"
regex = "1"
indexmap = "2"
serde_json = "1"

[features]
# 診断フック `AR_TW_STATS=1`（#10）。**既定では無効＝コード自体が消える。**
# 環境変数だけの分岐にすると `exec()` の 1 文ごとに OnceLock の atomic 読みが入り、
# 文ディスパッチ支配のワークロードで **11% 退行した**（partial_call_overhead.ar で実測）。
# 計測時は `cargo build --features tw_stats`（tw_stats.ps1 が自動で行う）。
tw_stats = []

# 実行時間分布の計測フック（src/prof.rs）。**既定では無効＝コード自体が消える。**
# `cargo build --release --features prof` でビルドし、`AR_PROF=1`（段のみ）/
# `AR_PROF=ops`（段 + op 別サンプリング）で有効化する。
prof = []

# エディタ解析ビルド（`crates/arrow-frontend` 専用）。
# import 解析をファイルシステムに触れない `parser/imports_editor.rs` に差し替え、
# `parser/cs_assembly` を外す。**bin では決して有効にしない**（ここで宣言しているのは
# 共有ソースの `#[cfg(feature = "editor")]` に対する unexpected_cfgs 警告を防ぐため）。
editor = []

[[bench]]
name = "field_access"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
