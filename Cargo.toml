[package]
name = "havakyrie"
version = "0.1.0"
edition = "2021"

[dependencies]
terminal_size = "0.4"
rustpython-parser = "0.4"
pyo3 = { version = "0.22", features = ["auto-initialize"] }
libloading = "0.8"
regex = "1"
indexmap = "2"
serde_json = "1"
inkwell = { git = "https://github.com/TheDan64/inkwell", branch = "master", features = ["llvm22-1"], optional = true }

[features]
default = []
# Enable LLVM JIT native compilation.
# Install LLVM 22 (winget install LLVM.LLVM), add hv_config.json with
# {"llvm":{"path":"C:/Program Files/LLVM"}}, then run `cargo build --features llvm`
# twice: first run writes .cargo/config.toml, second run compiles with LLVM.
llvm = ["dep:inkwell"]
